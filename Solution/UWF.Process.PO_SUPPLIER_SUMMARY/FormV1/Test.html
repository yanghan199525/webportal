<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>

    <div id="appRest" onclick="getSelectedValue()">
        <input type="radio" id="contactChoice2" name="contact" value="agree" checked />同意
        <input type="radio" id="contactChoice3" name="contact" value="reject" />拒绝
    </div>
    <div>
        <input type="radio" name="contact1" value="agree" checked />同意
        <input type="radio" name="contact1" value="reject" />拒绝

        <ult:TextBox ID="fld_REASONS" title="" data-type='string' data-field="REASONS" runat="server" Text='<%#Eval("REASONS")%>' Format="" Width="90%"></ult:TextBox>
    </div>

</body>
</html>
<script>

    function getSelectedValue() {
        var radioButtons = document.getElementsByName("contact");
        var selectedValue = "";
        for (var i = 0; i < radioButtons.length; i++) {
            if (radioButtons[i].checked) {
                selectedValue = radioButtons[i].value;
                appRest.value = selectedValue;
                break;
            }
        }
        console.log("选中的值为：" + appRest.value);
    }
</script>
